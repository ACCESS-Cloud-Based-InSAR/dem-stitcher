[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = 'dem_stitcher'
requires-python = '>=3.11'
authors = [
    {name ='Charlie Marshak, David Bekaert, Michael Denbina, Marc Simard, Joseph H. Kennedy, Simran Sangha, Grace Bato', email ='access_cloud_based_insar@jpl.nasa.gov'}
]
description = 'Download and merge DEM tiles'
license = {text = 'Apache-2.0'}
classifiers = [
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]

dynamic = ['version', 'readme']

dependencies = [
        'affine',
        'boto3',  # required for rasterio vsis3 support
        'geopandas',
        'importlib_metadata',  # drop when py>=3.8
        'numpy',
        'pyarrow',  # required for geoparquet tile tables
        'pyproj',
        'rasterio',
        'requests',
        'shapely',
        'tqdm',
]

[project.optional-dependencies]
develop = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/ACCESS-Cloud-Based-InSAR/dem-stitcher"
"Bug Tracker" = "https://github.com/ACCESS-Cloud-Based-InSAR/dem-stitcher/issues"

[tool.setuptools]
include-package-data = true
zip-safe = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["notebooks*", "tests*"]

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools_scm]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "site-packages",
    "notebooks/*",
    "tests/data/*",
]
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = [
    "F",   # flake8: https://docs.astral.sh/ruff/rules/#flake8-f
    "E",   # flake8: https://docs.astral.sh/ruff/rules/#flake8-e
    "I",   # isort: https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade: https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "D",   # pydocstyle: https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "ANN", # annotations: https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
    "PTH", # use-pathlib-pth: https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "TRY", # tryceratops
]

ignore = [
  "D100",   # Missing docstring in public module
  "D101",   # Missing docstring in public class
  "D102",   # Missing docstring in public method
  "D103",   # Missing docstring in public function
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "TRY003", # Avoid specifying long messages outside the exception
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
lines-after-imports = 2

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
dem_stitcher = { path = ".", editable = true }

[tool.pixi.tasks]
lint = "ruff check src tests"
format = "ruff format src tests"
fix = "ruff check --fix src tests"
format-check = "ruff format --diff src tests"
test = "pytest . -m 'not notebook'"

[tool.pixi.dependencies]
python = ">=3.11,<4"
affine = ">=2.4.0,<3"
boto3 = ">=1.43.64,<2"
dateparser = ">=1.4.2,<2"
fiona = ">=1.10.1,<2"
gdal = ">=3.11,<4"
# The AvoidNoData collision handling the rio_tools tests pin down is uniform only from gdal 3.11
# (https://github.com/OSGeo/gdal/pull/11713); libgdal-core is otherwise free-floating via rasterio.
libgdal-core = ">=3.11,<4"
geopandas = ">=1.1.4,<2"
jinja2 = ">=3.1.6,<4"
joblib = ">=1.5.3,<2"
matplotlib = ">=3.10.9,<4"
numpy = ">=2.2.6,<3"
pyarrow = ">=16,<23"
pyproj = ">=3.7.1,<4"
requests = ">=2.34.2,<3"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-mock = ">=3.15.1,<4"
rasterio = ">=1.4.3,<2"
ruff = ">=0.16.1,<0.17"
setuptools = ">=61.0"
setuptools_scm = ">=6.2"
shapely = ">=2.1.2,<3"
tqdm = ">=4.70.0,<5"
importlib_metadata = ">=9.0.0,<10"
jupyterlab = ">=4.6.2,<5"
jupyter-collaboration = ">=5.0.0,<6"
pip = ">=26.2.1,<27"
papermill = ">=2.7.0,<3"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# `default` is the newest supported python and the only environment installed locally.
# The pyXYZ environments exist for the CI matrix; `pixi run -e py311 ...` builds one on demand.
[tool.pixi.environments]
default = { features = ["py314"], solve-group = "py314" }
py311 = { features = ["py311"], solve-group = "py311" }
py312 = { features = ["py312"], solve-group = "py312" }
py313 = { features = ["py313"], solve-group = "py313" }
