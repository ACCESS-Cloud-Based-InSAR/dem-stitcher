name: Pytest

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  pytest:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: py311
            python: "3.11"
          - environment: py312
            python: "3.12"
          - environment: py313
            python: "3.13"
          # `default` is the newest supported python; see `[tool.pixi.environments]` in pyproject.toml
          - environment: default
            python: "3.14"
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: extractions/netrc@v3
        with:
          machine: urs.earthdata.nasa.gov
          username: ${{ secrets.EARTHDATA_USERNAME }}
          password: ${{ secrets.EARTHDATA_PASSWORD }}

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest
          environments: ${{ matrix.environment }}

      - name: Check python version
        run: pixi run -e ${{ matrix.environment }} python -c "import sys; assert sys.version.startswith('${{ matrix.python }}.'), sys.version"

      - name: Pytest in pixi environment
        run: pixi run -e ${{ matrix.environment }} pytest . -m 'not notebook'
